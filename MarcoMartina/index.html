<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Young. Sexy. Iconic. - Home</title>
    <style>
        /* --- RESET E BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            background-color: black; /* Evita bordi bianchi durante il caricamento */
        }

        /* --- BACKGROUND --- */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* FOTO DI SFONDO */
            background-image: url('sfondo.jpeg'); 
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
            z-index: 0;
        }

        /* --- LAYOUT CONTAINER --- */
        .container {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            
            /* MODIFICA 3: Padding dinamico per la Safe Area */
            padding-top: max(2rem, env(safe-area-inset-top));     /* Protegge dalla Notch */
            padding-bottom: max(4rem, env(safe-area-inset-bottom)); /* Protegge dalla barra Home */
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        /* --- LOGO AREA --- */
        .logo-area {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 10px; 
        }

        /* Stile per il Logo principale */
        .logo-img {
            width: 100px; 
            height: auto; 
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); 
        }

        /* Stile per il Payoff */
        .payoff-img {
            width: 140px; 
            height: auto;
            display: block;
            opacity: 0.9; 
        }

        /* --- CONTENUTO CENTRALE E BOTTONI --- */
        .content-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        h1 {
            color: white;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            line-height: 1.2;
        }

        p {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        p1 {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 0.5rem;
            line-height: 0.1; /* Ho corretto la virgola in punto */
        }

        /* --- PULSANTI --- */
        .btn {
            display: block;
            width: 100%;
            max-width: 350px;
            padding: 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
        }

        .btn:active {
            transform: scale(0.96);
        }

    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="container">
        
        <header class="logo-area">
            <img src="logo.png" alt="Logo" class="logo-img">
            <img src="mg.png" alt="Payoff" class="payoff-img">
        </header>

        <main class="content-area">
            <h1>Solo per my <br>Martina e Marco</h1>
            <p>You guys are so hot btw...</p>
            
            <a href="pagine.html" class="btn btn-primary">Media Gallery</a>
            <a href="Music.html" class="btn btn-secondary">Stream</a>
        </main>

    </div>
    
</body>
</html>
