<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Young. Sexy. Iconic. - Home</title>
    <style>
        /* --- RESET E BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* --- BACKGROUND --- */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* FOTO DI SFONDO */
            background-image: url('/sfondo.jpeg'); 
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
            z-index: 0;
        }

        /* --- LAYOUT CONTAINER --- */
        .container {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1.5rem 4rem 1.5rem;
        }

        /* --- LOGO AREA (MODIFICATA) --- */
        .logo-area {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column; /* Mette le immagini una sotto l'altra */
            align-items: center;
            gap: 10px; /* Spazio tra Logo e Payoff */
        }

        /* Stile per il Logo principale */
        .logo-img {
            width: 100px; /* Larghezza del logo - modificabile */
            height: auto; /* Mantiene le proporzioni */
            display: block;
            /* Rimuovi il filtro ombra se il tuo logo � scuro */
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); 
        }

        /* Stile per il Payoff (immagine sotto) */
        .payoff-img {
            width: 140px; /* Larghezza del payoff - solitamente un po' pi� largo */
            height: auto;
            display: block;
            opacity: 0.9; /* Leggera trasparenza per eleganza */
        }

        /* --- CONTENUTO CENTRALE E BOTTONI --- */
        .content-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        h1 {
            color: white;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            line-height: 1.2;
        }

        p {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        p1 {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 0.5rem;
            line-height: 0,1;
        }


        /* --- PULSANTI --- */
        .btn {
            display: block;
            width: 100%;
            max-width: 350px;
            padding: 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
        }

        .btn:active {
            transform: scale(0.96);
        }

    </style>
</head>
<body>

    <div class="bg-image"></div>

        <main class="content-area">

            <p>You guys are so hot btw...</p>
            
            <a href="pagine.html" class="btn btn-primary">Media Gallery</a>
            <a href="Music.html" class="btn btn-secondary">Stream</a>

    </div>

    
</body>
</html>
