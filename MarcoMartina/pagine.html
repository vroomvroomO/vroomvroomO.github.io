<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Young. Sexy. Iconic. - Gallery</title>
    <style>
        /* --- STILI --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto; 
        }

        /* Sfondo */
        .bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('sfondo.jpeg'); 
            background-size: cover; background-position: center; z-index: -2;
        }
        
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.8));
            z-index: -1;
        }

        /* Container */
        .container {
            position: relative; z-index: 1; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 2rem 1.5rem 2rem 1.5rem;
        }

        /* Header */
        .header-small { margin-bottom: 2rem; display: flex; align-items: center; gap: 10px; opacity: 0.8; }
        .logo-small { height: 40px; width: auto; }
        
        h2 { color: white; margin-bottom: 2rem; font-weight: 700; font-size: 1.8rem; text-align: center; }
        p { color: rgba(255, 255, 255, 0.9); text-align: center; margin-bottom: 1.5rem; font-size: 1rem; line-height: 1.5; }

        /* Griglia Foto */
        .gallery-feed {
            display: flex; flex-direction: column; gap: 25px;
            width: 100%; max-width: 450px; margin-bottom: 4rem;
        }

        .gallery-item {
            position: relative; width: 100%; aspect-ratio: 1 / 1;
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer; transition: transform 0.2s ease;
            background-color: rgba(255,255,255,0.1);
        }
        .gallery-item:active { transform: scale(0.96); }

        .thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* Badge Play */
        .video-badge {
            position: absolute; bottom: 15px; right: 15px; 
            color: white; font-size: 16px; pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5); 
        }

        /* Pulsante Indietro (Basso) */
        .btn-back {
            display: inline-block; padding: 12px 24px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white; border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px; text-decoration: none; font-size: 0.9rem;
            backdrop-filter: blur(5px); margin-top: auto;
        }

        /* Pulsante Home (Alto Sinistra) */
        .home-btn-top {
            position: fixed; top: 20px; left: 20px;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; width: 50px; height: 50px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, background-color 0.3s;
            z-index: 1000; text-decoration: none;
        }
        .home-btn-top:hover { transform: scale(1.1); background-color: rgba(0, 0, 0, 0.6); }

        /* Modale Video Unico */
        .video-modal {
            display: none; position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            align-items: center; justify-content: center;
            padding: 20px; backdrop-filter: blur(10px);
        }

        .modal-content-wrapper { position: relative; width: 100%; max-width: 800px; }

        video.modal-video {
            width: 100%; height: auto; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 80vh;
        }

        .close-btn {
            position: absolute; top: -45px; right: 0;
            color: white; font-size: 35px; font-weight: bold;
            cursor: pointer; z-index: 1001; padding: 5px;
        }
        
        /* --- CLASSE PER FOTO ORIZZONTALI --- */
.gallery-item.horizontal {
    aspect-ratio: 4 / 3; 
    border-radius: 16px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer; transition: transform 0.2s ease;
            background-color: rgba(255,255,255,0.1);
}
    </style>
</head>
<body>

    <a href="index.html" class="home-btn-top" title="Torna alla Home">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </a>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="container">
        <header class="header-small">
            <img src="logo.png" alt="Logo" class="logo-small">
        </header>
        
        <h2>Media Gallery</h2>
        <p> Clicca ▶ per aprire i video, stupid bitch...</p>

        <div class="gallery-feed">
            
            <div class="gallery-item">
                <img src="PG1.png" alt="Foto 1" class="thumb-img">
            </div>
            
            <div class="gallery-item.horizontal">
                <img src="TrayCard.jpg" alt="track list" class="thumb-img">
            </div>
            
            <div class="gallery-item.horizontal">
                <img src="backcard.jpg" alt="track list" class="thumb-img">
            </div>

            <div class="gallery-item" >
                <img src="PG2.png" alt="Foto 2" class="thumb-img">
            </div>

             <div class="gallery-item" >
                <img src="PG3.png" alt="Foto 3" class="thumb-img">
            </div>

            <div class="gallery-item" onclick="playVideo('marti.mp4')">
                <img src="PG4.png" alt="Foto 4" class="thumb-img">
                <div class="video-badge">▶</div>
            </div>

            <div class="gallery-item" onclick="playVideo('marc.mp4')">
                <img src="PG5.png" alt="Foto 5" class="thumb-img">
                <div class="video-badge">▶</div>
            </div>

            <div class="gallery-item" onclick="playVideo('halloween.mp4')">
                <img src="PG6.png" alt="Foto 6" class="thumb-img">
                <div class="video-badge">▶</div>
            </div>

             <div class="gallery-item">
                <img src="PG7.png" alt="Foto 7" class="thumb-img">
            </div>

            <div class="gallery-item" onclick="playVideo('uscita.mp4')">
                <img src="PG8.png" alt="Foto 8" class="thumb-img">
                <div class="video-badge">▶</div>
            </div>

            <div class="gallery-item" onclick="playVideo('Mood.mp4')">
                <img src="PG9.png" alt="Foto 9" class="thumb-img">
                <div class="video-badge">▶</div>
            </div>
             
            <div class="gallery-item">
                <img src="PG10.png" alt="Foto 10" class="thumb-img">
            </div>
            <div class="gallery-item">
                <img src="PG11.png" alt="Foto 11" class="thumb-img">
            </div>
            
            <div class="gallery-item">
                <img src="PG12.png" alt="Foto 12" class="thumb-img">
            </div>

        </div>

        <a href="index.html" class="btn-back">← Torna alla Home</a>
    </div>

    <div id="videoPlayerModal" class="video-modal">
        <div class="modal-content-wrapper">
            <span class="close-btn" onclick="stopVideo()">&times;</span>
            <video id="mainVideo" controls class="modal-video">
                <source src="" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        // Funzione semplificata: prende il nome del file e lo fa partire
        function playVideo(nomeFile) {
            var modal = document.getElementById('videoPlayerModal');
            var video = document.getElementById('mainVideo');
            
            // Imposta il file video corretto
            video.src = nomeFile;
            
            // Mostra il player e avvia
            modal.style.display = "flex";
            video.play();
        }

        // Funzione per chiudere e stoppare
        function stopVideo() {
            var modal = document.getElementById('videoPlayerModal');
            var video = document.getElementById('mainVideo');
            
            modal.style.display = "none";
            video.pause();
            video.currentTime = 0;
            video.src = ""; // Pulisce
        }
    </script>

</body>
</html>
