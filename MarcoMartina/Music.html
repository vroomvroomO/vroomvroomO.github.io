<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Young. Sexy. Iconic. - Music</title>
    <style>
        /* --- RESET E BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Qui cambiamo rispetto alla home: permettiamo lo scroll verticale */
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto; 
        }

        /* --- BACKGROUND (Fisso) --- */
        .bg-image {
            position: fixed; /* IMPORTANTE: Lo sfondo non scrolla */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/sfondo.jpeg'); 
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        .overlay {
            position: fixed; /* Anche l'ombra resta ferma */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.8));
            z-index: -1;
        }

        /* --- LAYOUT CONTAINER --- */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Padding diverso: meno spazio sotto per permettere lo scroll */
            padding: 2rem 1.5rem 2rem 1.5rem; 
        }

        /* --- LOGO HEADER (Più piccolo per la pagina interna) --- */
        .header-small {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.8;
        }

        .logo-small {
            height: 40px; /* Logo più discreto */
            width: auto;
        }

        /* --- SEZIONE MUSICA --- */
        .music-section {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 2rem; /* Spazio tra i due player */
            margin-bottom: 3rem;
        }

        .player-wrapper {
            width: 100%;
        }

        .player-label {
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Stile standard per gli iframe (i box della musica) */
        iframe {
            border-radius: 12px; /* Angoli arrotondati come iOS */
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            width: 100%;
            display: block;
        }

        /* --- BACK BUTTON --- */
        .btn-back {
            display: inline-block;
            padding: 12px 24px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            margin-top: auto; /* Spinge il bottone in fondo se c'è spazio */
        }

    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="container">
        
        <header class="header-small">
            <img src="/logo.png" alt="Logo" class="logo-small">
            </header>

        <main class="music-section">
            
            

            <div class="player-wrapper">
                <div class="player-label">
                    <span style="color:#FB233B">●</span> Apple Music
                </div>

                <iframe allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write" frameborder="0" height="450" style="width:100%;max-width:660px;overflow:hidden;background:transparent;" sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation" src="https://embed.music.apple.com/it/playlist/mm/pl.u-leyllvJuMg6E62D?l=en-GB"></iframe>
                </div>
            <div class="player-wrapper">
                <div class="player-label">
                    <span style="color:#1DB954">●</span> Spotify
                </div>
                
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>

        </main>

        <a href="index.html" class="btn-back">← Torna alla Home</a>

    </div>

    
</body>
</html>
