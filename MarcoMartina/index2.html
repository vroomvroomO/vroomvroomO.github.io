<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0c29">

    <title>Young. Sexy. Iconic. - Home</title>
    <style>
        /* --- RESET E BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100%;
            overflow: hidden;

            /* --- SFONDO DINAMICO (ANIMATO) --- */
            /* Gradiente scuro che si muove lentamente */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Definizione dell'animazione dello sfondo */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- FOTO DI SFONDO --- */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* TUA FOTO */
            background-image: url('sfondo.jpeg'); 
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* --- PATINA SCURA SOPRA LA FOTO --- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.6));
            z-index: 0;
        }

        /* --- LAYOUT CONTAINER --- */
        .container {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Spinge header su e contenuto giù */
            align-items: center;
            
            /* --- GESTIONE SAFE AREA (NOTCH IPHONE) --- */
            /* Usa env() per capire quanto spazio lasciare */
            padding-top: max(2rem, env(safe-area-inset-top)); 
            padding-bottom: max(4rem, env(safe-area-inset-bottom));
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        /* --- AREA LOGO --- */
        .logo-area {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 10px; 
        }

        .logo-img {
            width: 100px; 
            height: auto; 
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); 
        }

        .payoff-img {
            width: 140px; 
            height: auto;
            display: block;
            opacity: 0.9; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        /* --- CONTENUTO CENTRALE --- */
        .content-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem; /* Spazio tra i bottoni e il testo */
            margin-bottom: 1rem;
        }

        h1 {
            color: white;
            font-size: 2.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            line-height: 1.2;
        }

        p {
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.1rem;
            line-height: 1.5;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* --- STILE BOTTONI (GLASSMORPHISM) --- */
        .btn {
            display: block;
            width: 100%;
            max-width: 350px;
            padding: 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            
            /* Effetto Vetro */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); /* Per Safari */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            
            transition: transform 0.2s ease, background-color 0.3s;
        }

        .btn-primary {
            background-color: rgba(255, 255, 255, 0.15); 
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08); 
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Effetto click */
        .btn:active {
            transform: scale(0.96);
            background-color: rgba(255, 255, 255, 0.25);
        }

    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div class="overlay"></div>

    <div class="container">
        
        <header class="logo-area">
            <img src="logo.png" alt="Logo" class="logo-img">
            <img src="mg.png" alt="Payoff" class="payoff-img">
        </header>

        <main class="content-area">
            <h1>Solo per my <br>Martina e Marco</h1>
            <p>You guys are so hot btw...</p>
            
            <a href="pagine.html" class="btn btn-primary">Media Gallery</a>
            <a href="Music.html" class="btn btn-secondary">Stream</a>
        </main>

    </div>
    
</body>
</html>
